			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# WebRTC SPM binary doesn't include debug symbols — create stub dSYM\n# to satisfy App Store Connect validation. Crash reports from WebRTC\n# won't be symbolicated, but our own code will be.\nDSYM_OUT=\"${DWARF_DSYM_FOLDER_PATH}/WebRTC.framework.dSYM\"\nif [ ! -d \"$DSYM_OUT\" ]; then\n    WEBRTC_FW=$(find \"${TARGET_BUILD_DIR}\" -name \"WebRTC.framework\" -type d 2>/dev/null | head -1)\n    if [ -n \"$WEBRTC_FW\" ] && [ -f \"$WEBRTC_FW/WebRTC\" ]; then\n        # Extract UUID from the binary\n        UUID=$(dwarfdump --uuid \"$WEBRTC_FW/WebRTC\" 2>/dev/null | head -1 | awk '{print $2}')\n        if [ -n \"$UUID\" ]; then\n            # Create minimal dSYM directory structure\n            mkdir -p \"$DSYM_OUT/Contents/Resources/DWARF\"\n            cat > \"$DSYM_OUT/Contents/Info.plist\" << PLIST\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">\n<plist version=\"1.0\">\n<dict>\n    <key>CFBundleDevelopmentRegion</key><string>English</string>\n    <key>CFBundleIdentifier</key><string>com.apple.xcode.dsym.WebRTC</string>\n    <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>\n    <key>CFBundlePackageType</key><string>dSYM</string>\n    <key>CFBundleSignature</key><string>????</string>\n    <key>CFBundleVersion</key><string>1</string>\n    <key>dSYM_UUID</key>\n    <dict><key>arm64</key><string>${UUID}</string></dict>\n</dict>\n</plist>\nPLIST\n            # Copy binary as DWARF stub (no symbols, but UUID matches)\n            cp \"$WEBRTC_FW/WebRTC\" \"$DSYM_OUT/Contents/Resources/DWARF/WebRTC\"\n        fi\n    fi\nfi\n";
		};

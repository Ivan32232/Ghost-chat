name: Server CI

on:
  push:
    paths:
      - 'server/**'
      - 'deploy/**'
      - '.github/workflows/server-ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'deploy/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: TypeScript compile
        working-directory: server
        run: npx tsc --noEmit

      - name: Run unit + integration tests
        working-directory: server
        run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Create dummy keys for Docker build
        run: |
          mkdir -p deploy/keys
          openssl ecparam -genkey -name prime256v1 -noout -out deploy/keys/AuthKey.p8
          echo '{"project_id":"ci-test","client_email":"ci@test.iam.gserviceaccount.com","private_key":"test"}' > deploy/keys/firebase-sa.json

      - name: Docker build
        working-directory: deploy
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml build ghost-chat

      - name: Docker up (dev mode — CI override publishes port 3000 to host)
        working-directory: deploy
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d ghost-chat
          # Wait for healthcheck to report healthy instead of blind sleep.
          for i in $(seq 1 20); do
            status=$(docker inspect --format '{{.State.Health.Status}}' ghost-chat 2>/dev/null || echo missing)
            echo "attempt $i: $status"
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          [ "$(docker inspect --format '{{.State.Health.Status}}' ghost-chat)" = "healthy" ]

      - name: Health check (inside container)
        run: |
          docker exec ghost-chat node -e "
            require('http').get('http://localhost:3000/health', r => {
              let d=''; r.on('data',c=>d+=c);
              r.on('end',()=>{
                console.log('Status:', r.statusCode, 'Body:', d);
                process.exit(r.statusCode===200?0:1);
              });
            }).on('error', e => { console.error(e.message); process.exit(1); });
          "

      - name: Health check (from host via published CI port)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health)
          echo "Host health check: $STATUS"
          [ "$STATUS" = "200" ]

      - name: TURN credentials check
        run: |
          TURN=$(curl -s http://localhost:3000/api/turn-credentials)
          echo "TURN: $TURN"
          # Dev mode without TURN_SECRET returns 503 (documented). Accept either
          # a real credential payload or the documented 503 shape.
          echo "$TURN" | grep -qE '"credential"|"TURN not configured"'

      - name: Docker down
        if: always()
        working-directory: deploy
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down

services:
  # --- Always runs (dev + prod) ---
  ghost-chat:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ghost-chat
    container_name: ghost-chat
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3000
      - TRUST_PROXY=${TRUST_PROXY:-0}
      - TURN_SECRET=${TURN_SECRET:-}
      - TURN_DOMAIN=${TURN_DOMAIN:-localhost}
      - APNS_KEY_ID=${APNS_KEY_ID:-}
      - APNS_TEAM_ID=${APNS_TEAM_ID:-}
      - APNS_KEY_PATH=/app/keys/AuthKey.p8
      - APNS_BUNDLE_ID=${APNS_BUNDLE_ID:-com.kordar.ghostchat}
      - FCM_SA_PATH=/app/keys/firebase-sa.json
    volumes:
      - ./keys:/app/keys:ro
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ghost-network

  # --- Dev profile: coturn without TLS (local testing only) ---
  coturn-dev:
    image: coturn/coturn:4.6.2
    container_name: ghost-turn-dev
    restart: unless-stopped
    network_mode: host
    profiles: ["dev"]
    command:
      - -n
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-ghost-dev-secret-NOT-FOR-PRODUCTION}
      - --realm=localhost
      - --listening-port=3478
      - --no-tls
      - --no-dtls
      - --total-quota=100
      - --no-multicast-peers
      - --log-file=stdout
      - --no-cli

  # --- Prod profile: coturn with TLS ---
  coturn:
    image: coturn/coturn:4.6.2
    container_name: ghost-turn
    restart: unless-stopped
    network_mode: host
    profiles: ["prod"]
    volumes:
      - ./turnserver.conf:/etc/turnserver.conf:ro
      - ./ssl:/etc/ssl/turn:ro
    command: ["-c", "/etc/turnserver.conf"]

  # --- Prod profile: nginx reverse proxy with TLS ---
  nginx:
    image: nginx:1.27-alpine
    container_name: ghost-nginx
    restart: unless-stopped
    profiles: ["prod"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./ghostchat-www:/var/www/ghostchat:ro
    depends_on:
      - ghost-chat
    networks:
      - ghost-network

  # --- Prod profile: certbot for Let's Encrypt renewal ---
  certbot:
    image: certbot/certbot
    container_name: ghost-certbot
    profiles: ["prod"]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  ghost-network:
    driver: bridge

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml font/woff2;

    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=ws:1m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    upstream ghost_app {
        server ghost-chat:3000;
        keepalive 64;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # HTTP → HTTPS redirect (covers old + new domain)
    server {
        listen 80;
        server_name ghostchat.one www.ghostchat.one gbskgs.xyz www.gbskgs.xyz;

        # ACME challenge must stay plaintext for certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://ghostchat.one$request_uri;
        }
    }

    # Legacy domain (gbskgs.xyz) → permanent redirect to ghostchat.one
    server {
        listen 443 ssl;
        http2 on;
        server_name gbskgs.xyz www.gbskgs.xyz;

        ssl_certificate /etc/nginx/ssl/gbskgs.xyz/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/gbskgs.xyz/privkey.pem;

        return 301 https://ghostchat.one$request_uri;
    }

    # GHOSTCHAT.ONE — main TLS server
    server {
        listen 443 ssl;
        http2 on;
        server_name ghostchat.one www.ghostchat.one;

        ssl_certificate /etc/nginx/ssl/ghostchat.one/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/ghostchat.one/privkey.pem;

        ssl_protocols TLSv1.3 TLSv1.2;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:GhostSSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' wss: ws:; img-src 'self' data:; font-src 'self'; media-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;

        limit_conn conn 20;

        # WebSocket signaling — app code upstream, long-lived upgrade
        location /ws {
            limit_req zone=ws burst=10 nodelay;
            proxy_pass http://ghost_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # REST API — TURN creds, push, pending rooms
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://ghost_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "no-store" always;
        }

        # Health endpoint — keep on upstream so it genuinely reflects app state
        location = /health {
            proxy_pass http://ghost_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        # Apple Universal Links + Android App Links — served as plain files
        location /.well-known/ {
            root /var/www/ghostchat;
            default_type application/json;
            try_files $uri =404;
        }

        # Landing page + static assets (served from docker volume)
        location / {
            limit_req zone=general burst=30 nodelay;
            root /var/www/ghostchat;
            index index.html;
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        }

        # Block dotfiles (except well-known)
        location ~ /\.(?!well-known) {
            deny all;
        }
    }

    # Catch-all — unknown hostnames get dropped.
    # http2 is already enabled on 0.0.0.0:443 by the main server block;
    # redeclaring here would emit "protocol options redefined" warnings.
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        ssl_certificate /etc/nginx/ssl/ghostchat.one/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/ghostchat.one/privkey.pem;
        return 444;
    }
}

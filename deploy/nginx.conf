events {
    worker_connections 1024;
}

http {
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript font/woff2;

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=ws:1m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    upstream ghost_app {
        server ghost-chat:3000;
        keepalive 64;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name ghostchat.one www.ghostchat.one;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://ghostchat.one$request_uri;
        }
    }

    # HTTPS — Ghost Chat
    server {
        listen 443 ssl http2;
        server_name ghostchat.one www.ghostchat.one;

        ssl_certificate /etc/nginx/ssl/ghostchat.one/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/ghostchat.one/privkey.pem;

        ssl_protocols TLSv1.3 TLSv1.2;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:GhostSSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        limit_conn conn 20;

        # WebSocket
        location /ws {
            limit_req zone=ws burst=10 nodelay;
            proxy_pass http://ghost_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # API
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://ghost_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "no-store" always;
        }

        # Health
        location /health {
            proxy_pass http://ghost_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Block dotfiles
        location ~ /\.(?!well-known) {
            deny all;
        }
    }

    # Catch-all — drop unknown hosts
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        ssl_certificate /etc/nginx/ssl/ghostchat.one/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/ghostchat.one/privkey.pem;
        return 444;
    }
}
